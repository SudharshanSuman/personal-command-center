<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Command Center</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 22px;
      font-weight: 600;
    }
    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 12px;
      background: #27272a;
      color: #38bdf8;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Personal Command Center</h1>
    <p>Desktop Electron shell initialized. Waiting for local-first static SPA bundle to land.</p>
    <div class="badge">Linux Desktop Shell Ready</div>
  </div>
</body>
</html>
